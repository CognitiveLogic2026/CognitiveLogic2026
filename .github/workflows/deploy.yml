name: Deploy QEN to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Debug
        run: |
          which scp
          ls -la qen_graph_v2.json

      - name: Copy qen_graph_v2.json to server
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no qen_graph_v2.json root@${{ secrets.HETZNER_HOST }}:/root/qen_graph_v2.json

      - name: Restart FastAPI service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} "systemctl restart cognitivelogic && echo Deploy completato"
